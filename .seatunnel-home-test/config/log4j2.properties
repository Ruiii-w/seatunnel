status = error
name = PropertiesConfig

property.file_path = ${sys:seatunnel.logs.path}
property.file_name = ${sys:seatunnel.logs.file_name}

appender.console.type = Console
appender.console.name = consoleAppender
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%t] %c{1} - %m%n

appender.file.type = RollingFile
appender.file.name = fileAppender
appender.file.fileName = ${file_path}/${file_name}.log
appender.file.filePattern = ${file_path}/${file_name}.log.%d{yyyy-MM-dd-HH}-%i
appender.file.layout.type = PatternLayout
appender.file.layout.pattern = %d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%t] %c{1} - %m%n
appender.file.policies.type = Policies
appender.file.policies.time.type = TimeBasedTriggeringPolicy
appender.file.policies.time.interval = 1

rootLogger.level = INFO
rootLogger.appenderRef.console.ref = consoleAppender
rootLogger.appenderRef.file.ref = fileAppender

logger.hazelcast.name = com.hazelcast
logger.hazelcast.level = INFO

logger.seatunnel.name = org.apache.seatunnel
logger.seatunnel.level = INFO
