hazelcast:
  cluster-name: seatunnel
  network:
    rest-api:
      enabled: true
      endpoint-groups:
        CLUSTER_WRITE:
          enabled: true
        DATA:
          enabled: true
    join:
      tcp-ip:
        enabled: true
        member-list:
          - localhost
    port:
      auto-increment: false
      port: 5801
  properties:
    hazelcast.invocation.max.retry.count: 20
    hazelcast.tcp.join.port.try.count: 30
    hazelcast.logging.type: log4j2
    # ===== 高吞吐大数据量 (CPU >=16核) =====
    hazelcast.operation.generic.thread.count: 24
    hazelcast.operation.thread.count: 12
    hazelcast.operation.call.timeout.millis: 30000
    hazelcast.heartbeat.failuredetector.type: phi-accrual
    hazelcast.heartbeat.interval.seconds: 2
    hazelcast.max.no.heartbeat.seconds: 180
    hazelcast.heartbeat.phiaccrual.failuredetector.threshold: 10
    hazelcast.heartbeat.phiaccrual.failuredetector.sample.size: 200
    hazelcast.heartbeat.phiaccrual.failuredetector.min.std.dev.millis: 100
  # ===== IMap 表 TTL (防止数据无限增长) =====
  map:
    engine_runningJobState:
      time-to-live-seconds: 3600
      max-idle-seconds: 1800
    engine_ownedSlotProfilesIMap:
      time-to-live-seconds: 3600
      max-idle-seconds: 1800
    engine_runningJobInfo:
      time-to-live-seconds: 7200
      max-idle-seconds: 3600
    engine_checkpoint-id-map:
      time-to-live-seconds: 3600
    engine_finishedJobState:
      time-to-live-seconds: 3600
    engine_finishedJobMetrics:
      time-to-live-seconds: 3600
    engine_finishedJobVertexInfo:
      time-to-live-seconds: 3600
    engine_runningJobMetrics:
      time-to-live-seconds: 3600
