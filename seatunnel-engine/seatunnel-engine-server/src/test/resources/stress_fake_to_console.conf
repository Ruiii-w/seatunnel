env {
  parallelism = 5
  job.mode = "STREAMING"
  checkpoint.interval = 3000
}

source {
  FakeSource {
    result_table_name = "big_fake"
    row.num = 100000
    split.num = 50
    split.read-interval = 1000
    parallelism = 5
    schema = {
      fields {
        id = "int"
        name = "string"
        age = "int"
        score = "double"
        address = "string"
        phone = "string"
        email = "string"
        description = "string"
        create_time = "timestamp"
        update_time = "timestamp"
      }
    }
  }
}

transform {
  Sql {
    source_table_name = "big_fake"
    result_table_name = "transformed"
    query = "select id, name, age, score, address from big_fake where age > 18"
  }
}

sink {
  console {
    source_table_name = "transformed"
  }
}
